<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<title>RedLine Engine</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="brand">
  <span class="brand-mark"></span>
  <span class="brand-name">RedLine Engine</span>
</div>

<!-- First-pass animated assistant: bald, single hoop earring (viewer-right
     ear), three small hoops (viewer-left ear), nose ring (left nostril).
     Built with SVG/CSS since it's what's actually available here (no Rive
     editor access) — meant as a starting point, not a final design. -->
<div id="assistant" class="assistant">
  <svg viewBox="0 0 160 160" class="assistant-svg">
    <ellipse cx="80" cy="88" rx="46" ry="52" class="assistant-head" />
    <!-- left ear (viewer's left): three small hoops -->
    <ellipse cx="35" cy="90" rx="7" ry="14" class="assistant-ear" />
    <circle cx="33" cy="80" r="3" class="assistant-piercing" />
    <circle cx="33" cy="90" r="3" class="assistant-piercing" />
    <circle cx="33" cy="100" r="3" class="assistant-piercing" />
    <!-- right ear (viewer's right): single hoop earring -->
    <ellipse cx="125" cy="90" rx="7" ry="14" class="assistant-ear" />
    <circle cx="127" cy="98" r="5" class="assistant-piercing-hoop" />
    <!-- nose ring, left nostril -->
    <circle cx="70" cy="112" r="3.5" class="assistant-piercing-hoop" />
    <!-- eyes -->
    <g id="assistant-eyes">
      <ellipse cx="62" cy="80" rx="6" ry="7" class="assistant-eye" />
      <ellipse cx="98" cy="80" rx="6" ry="7" class="assistant-eye" />
    </g>
    <!-- eyebrows -->
    <path d="M53,66 Q62,60 71,66" class="assistant-brow" />
    <path d="M89,66 Q98,60 107,66" class="assistant-brow" />
    <!-- mouth -->
    <path id="assistant-mouth" d="M62,118 Q80,124 98,118" class="assistant-mouth" />
  </svg>
  <div class="assistant-label" id="assistant-label">pronto</div>
</div>

<div id="screen-input" class="screen active">
  <h1>Carica il tuo progetto</h1>
  <p class="hint">Seleziona la cartella con gli stem (voce + strumentale, o stem multipli), oppure un singolo file già mixato.</p>
  <button class="btn btn-primary" onclick="chooseInput()">Scegli cartella o file...</button>
  <div id="input-path" class="path-display"></div>
  <button id="btn-next" class="btn btn-accent" onclick="showScreen('screen-wizard')" disabled>Avanti</button>
</div>

<div id="screen-wizard" class="screen">
  <h1>Come vuoi il mix?</h1>

  <div class="field">
    <label>Aggressività <span id="aggressiveness-val">3</span>/5</label>
    <input type="range" id="aggressiveness" min="1" max="5" value="3" step="1"
           oninput="document.getElementById('aggressiveness-val').textContent = this.value">
  </div>

  <div class="field">
    <label>Calore (freddo/brillante &larr;&rarr; caldo)</label>
    <input type="range" id="warmth" min="-1" max="1" value="0" step="0.1">
  </div>

  <div class="field">
    <label>Presenza voce (indietro &larr;&rarr; protagonista)</label>
    <input type="range" id="vocal_prominence" min="-1" max="1" value="0" step="0.1">
  </div>

  <div class="field">
    <label>Genere di riferimento (opzionale, lascia vuoto per usare quello rilevato)</label>
    <input type="text" id="genre_override" placeholder="es. Hip-Hop, Pop / Rock...">
  </div>

  <div class="field field-row">
    <label><input type="checkbox" id="do_mastering" checked> Esegui anche il mastering</label>
    <select id="platform">
      <option value="auto">Piattaforma: auto</option>
      <option value="spotify">Spotify (-14 LUFS)</option>
      <option value="apple">Apple Music (-16 LUFS)</option>
      <option value="youtube">YouTube (-13 LUFS)</option>
      <option value="club">Club/EDM (-9 LUFS)</option>
    </select>
  </div>

  <button class="btn btn-accent" onclick="startRun()">Avvia mix + mastering</button>
</div>

<div id="screen-progress" class="screen">
  <h1>Al lavoro...</h1>
  <div id="spinner" class="spinner"><div class="spinner-ring"></div></div>

  <div class="rack">
    <div class="module">
      <div class="module-title">EQ</div>
      <svg id="eq-svg" viewBox="0 0 300 90" class="eq-svg" preserveAspectRatio="none">
        <line x1="0" y1="45" x2="300" y2="45" class="eq-zero-line" />
        <path id="eq-path" d="M0,45 L300,45" class="eq-path" />
      </svg>
      <div class="module-detail" id="eq-detail">in attesa...</div>
    </div>

    <div class="module">
      <div class="module-title">Compressore</div>
      <div class="gr-meter"><div class="gr-fill" id="gr-fill"></div></div>
      <div class="module-detail" id="comp-detail">in attesa...</div>
    </div>

    <div class="module">
      <div class="module-title">De-esser</div>
      <div class="deess-dial" id="deess-dial">&mdash;</div>
      <div class="module-detail" id="deess-detail">in attesa...</div>
    </div>

    <div class="module">
      <div class="module-title">Ascolto / QC</div>
      <div class="headphones" id="headphones">&#127911;</div>
      <div class="module-detail" id="qc-detail">in attesa...</div>
    </div>
  </div>

  <div id="event-feed" class="event-feed"></div>

  <div id="log" class="log"></div>
  <div id="result" class="hidden"></div>
</div>

<script src="app.js"></script>
</body>
</html>
