[project]
name = "redline-engine"
version = "0.1.0"
description = "Standalone automatic mixing and mastering engine (pre-VST phase)"
requires-python = ">=3.10"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["redline*"]
